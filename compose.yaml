services:
  database:
    build:
      context: ./database
    container_name: sentiment-database
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sentiment_db}"
      POSTGRES_USER: "${POSTGRES_USER:-sentiment_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-sentiment_password}"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc \"SELECT to_regclass('public.analysis_history') IS NOT NULL\" | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-database-network

  backend:
    build:
      context: ./backend
    container_name: sentiment-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      HF_HOME: "${HF_HOME:-/models/huggingface}"
      HF_HUB_DISABLE_XET: "1"
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:-sentiment_db}"
      DB_USER: "${POSTGRES_USER:-sentiment_user}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-sentiment_password}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    volumes:
      - model-cache:/models/huggingface
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend-backend-network
      - backend-database-network

  frontend:
    build:
      context: ./frontend
    container_name: sentiment-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - frontend-backend-network

networks:
  frontend-backend-network:
    driver: bridge
  backend-database-network:
    driver: bridge

volumes:
  model-cache:
  database-data:

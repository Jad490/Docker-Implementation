version: 0.2

phases:
  pre_build:
    commands:
      - REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
  build:
    commands:
      - docker build --file backend/Dockerfile.ecs --tag "$BACKEND_REPOSITORY:$IMAGE_TAG" backend
      - docker tag "$BACKEND_REPOSITORY:$IMAGE_TAG" "$REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"
      - docker build --file frontend/Dockerfile.ecs --tag "$FRONTEND_REPOSITORY:$IMAGE_TAG" frontend
      - docker tag "$FRONTEND_REPOSITORY:$IMAGE_TAG" "$REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"
  post_build:
    commands:
      - docker push "$REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"
      - docker push "$REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"

server {
    listen 80;

    root /usr/share/nginx/html;
    index sentiment-analyzer.html;

    location / {
        try_files $uri $uri/ /sentiment-analyzer.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
